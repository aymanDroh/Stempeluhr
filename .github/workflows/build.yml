name: APK bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signatur-Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.STEMPELUHR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stempeluhr.p12"
            echo "STEMPELUHR_KEYSTORE=$RUNNER_TEMP/stempeluhr.p12" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signatur-Schlüssel hinterlegt (Secret STEMPELUHR_KEYSTORE_BASE64). Die APK ist mit einem Wegwerf-Schlüssel signiert und lässt sich später nicht als Update installieren. Es wird kein Release veröffentlicht."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Tests ausführen und APK bauen
        env:
          STEMPELUHR_KEYSTORE_PASSWORD: ${{ secrets.STEMPELUHR_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -PversionCode=${{ github.run_number }}

      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk "Stempeluhr-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Stempeluhr-${{ github.run_number }}
          path: Stempeluhr-*.apk

      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stempeluhr Build ${{ github.run_number }}
          body: Automatisch gebaute APK aus Commit ${{ github.sha }}. Auf dem Handy herunterladen und installieren.
          files: Stempeluhr-*.apk
          make_latest: true
